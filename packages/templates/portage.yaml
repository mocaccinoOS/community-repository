
################################################################################
## community.portage_select_fastest_binhost ###
################################################################################

{{ define "community.portage_select_fastest_binhost" }}
- if [ -f /usr/local/sbin/mocaccino-select-fastest-binhost.sh ]; then bash /usr/local/sbin/mocaccino-select-fastest-binhost.sh; else echo "binhost selection script not present in this layer, skipping"; fi
{{end}}


################################################################################
## community.pkglist_begin ###
################################################################################
{{ define "community.pkglist_begin" }}
- qlist -IRv | LC_ALL=C sort > /.layer.before
{{end}}

################################################################################
## community.pkglist_end ###
################################################################################
{{ define "community.pkglist_end" }}
- |
  mkdir -p /usr/share/mocaccino/packagelists && \
  qlist -IRv | LC_ALL=C sort > /.layer.after && \
  LC_ALL=C comm -13 /.layer.before /.layer.after > /usr/share/mocaccino/packagelists/{{ .Values.category }}-{{ .Values.name }}-{{ .Values.version }}.pkglist && \
  rm -f /.layer.before /.layer.after
{{end}}
