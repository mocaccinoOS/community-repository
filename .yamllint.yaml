extends: default

# Exclude luet files that are go templates
ignore:
  - "packages/**/templates/*"
  - "packages/**/build.yaml"
  - "packages/**/finalize.yaml"

rules:
  indentation:
    spaces: 2
  truthy:
    check-keys: false
  document-start: disable
  line-length: disable
  empty-lines: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
